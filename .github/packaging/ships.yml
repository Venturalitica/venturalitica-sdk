# What is allowed to leave this repository inside the distribution.
#
# This is an ALLOWLIST, and the shape is the point. `pyproject.toml` controls what ships with an
# `exclude` list: it names what must not leave, and lets through everything nobody thought to
# name. That is how a LaTeX log, the git ignore file, the pre-commit config and a reference to a
# private repository all travelled inside a published package without anyone deciding they should.
#
# A blocklist's coverage grows one line per incident. It gets long and respectable while its shape
# stays permissive: each entry documents something that already escaped.
#
# The comment beside that `exclude` list states the right principle — design records govern the
# product and are not part of it — and names two directories. Stating the principle next to a
# partial implementation is worse than stating nothing, because it closes the question that would
# have found the gap. The directories were excluded and a citation to a design record travelled
# anyway, inside a file that legitimately ships.
#
# So the question this file answers is the inverse one: not what we exclude, but **what leaves**.
# `.github/scripts/que-sale.sh` compares this list against the built artefact on every run, and
# anything undeclared is red. This directory does not ship, so the manifest is not its own subject.

# Non-code files that are meant to be in the distribution. Code under `src/` is not listed: that
# is the product, and the wheel's contents are governed by the packaging config.
ships:
  # Not chosen: hatchling puts it in the sdist whatever `pyproject.toml`'s exclude list says.
  # Measured on 2026-09-16 with three different patterns, all ignored. It is declared here because
  # the alternative was a rule in the exclude list that does nothing, which reads as handled.
  - .gitignore
  - CHANGELOG.md
  - CITATION.cff
  - LICENSE
  - PKG-INFO
  - README.md
  - SECURITY.md
  - publiccode.yml
  - pyproject.toml
  - src/venturalitica/assurance/graph/prompts/prompts.en.yaml
  - src/venturalitica/assurance/graph/prompts/prompts.es.yaml
  - src/venturalitica/metrics/catalog.yaml
  - src/venturalitica/policies/templates/huderia-cobra-design.oscal.yaml
  - src/venturalitica/policies/templates/huderia-cobra-prerelease.oscal.yaml

# Nothing is pending a decision any more. The six files that used to ship without anyone deciding
# they should — the method document, the repository's ownership file, the release script, two
# build-hygiene dotfiles and a stray LaTeX log — were removed from the distribution on 2026-09-16.
# The list stays declared and empty rather than being deleted: an empty list says «this was asked
# and the answer was none», and no list says nothing.
pending_decision: []
